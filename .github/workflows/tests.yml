name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The README claims 3.11+. This is what checks that claim.
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Turns each pytest failure into a GitHub annotation, which is
          # readable on the run page and through the public API. Without
          # it, diagnosing a red run means being signed in to download
          # the raw log.
          pip install pytest-github-actions-annotate-failures

      - name: Run tests
        # No API key and no network access are needed: every LLM call,
        # vector store and calendar is stubbed in the suite.
        run: python -m pytest tests/ -q --tb=short

      - name: Check the example env file matches the code
        run: python -m pytest tests/test_config.py -q
