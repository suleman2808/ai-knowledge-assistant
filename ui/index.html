<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riverbend Diagnostics — Assistant</title>
<link rel="stylesheet" href="/static/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230f5c63'/><text y='68' x='50' text-anchor='middle' font-size='52' font-family='sans-serif' fill='white'>R</text></svg>">
</head>
<body>
<div class="shell">

  <header>
    <div class="mark" aria-hidden="true">R</div>
    <div>
      <h1>Riverbend Diagnostics</h1>
      <p>Hawthorne &middot; Beaverton &middot; Gresham &middot; (503) 555-0142</p>
    </div>
    <div class="spacer"></div>
    <a class="status" href="/analytics" id="status" title="View analytics">
      <span class="dot" id="statusDot"></span><span id="statusText">checking</span>
    </a>
  </header>

  <main class="transcript" id="transcript" aria-live="polite" aria-label="Conversation"></main>

  <div class="composer">
    <div class="suggestions" id="suggestions">
      <button type="button">How much is a full blood count?</button>
      <button type="button">Do I need to fast for a lipid profile?</button>
      <button type="button">Book a blood test next Tuesday at 8am</button>
      <button type="button">When will my report be ready?</button>
    </div>
    <form id="composer">
      <label for="input" class="sr-only" hidden>Your message</label>
      <textarea id="input" rows="1" placeholder="Ask about tests, prices, preparation &mdash; or book a collection" autocomplete="off"></textarea>
      <button type="submit" id="send">Send</button>
    </form>
    <p class="disclaimer">
      An AI assistant. It answers only from the laboratory&rsquo;s own documents.
      For anything urgent, call (503) 555-0142.
    </p>
  </div>

</div>
<script src="/static/app.js"></script>
</body>
</html>
