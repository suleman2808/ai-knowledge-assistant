<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff dashboard — Riverbend Diagnostics</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%230f5c63'/><path d='M16 6.5c3.9 4.8 6.1 8.1 6.1 10.8a6.1 6.1 0 0 1-12.2 0c0-2.7 2.2-6 6.1-10.8z' fill='white'/></svg>">
<link rel="stylesheet" href="/static/styles.css">
<link rel="stylesheet" href="/static/admin.css">
</head>
<body>

<div id="gate" class="gate" hidden>
  <div class="vignette" aria-hidden="true"></div>
  <form class="gate-card" id="loginForm">
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" focusable="false">
        <rect width="32" height="32" rx="9" fill="currentColor"/>
        <path d="M16 6.5c3.9 4.8 6.1 8.1 6.1 10.8a6.1 6.1 0 0 1-12.2 0c0-2.7 2.2-6 6.1-10.8z" fill="#fff"/>
      </svg>
    </span>
    <h1>Staff dashboard</h1>
    <p class="muted">Conversations, bookings, complaints and patient records.</p>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password"
             placeholder="Enter the staff password" required>
    </div>
    <button type="submit">Sign in</button>
    <p class="error" id="loginError" hidden></p>
    <p class="gate-foot">
      Set by <code>ADMIN_PASSWORD</code>. With none set, the dashboard stays closed
      rather than open.
    </p>
  </form>
</div>

<div id="app" hidden>
  <div class="ambient" aria-hidden="true"></div>
  <header class="admin-head">
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" focusable="false">
        <rect width="32" height="32" rx="9" fill="currentColor"/>
        <path d="M16 6.5c3.9 4.8 6.1 8.1 6.1 10.8a6.1 6.1 0 0 1-12.2 0c0-2.7 2.2-6 6.1-10.8z" fill="#fff"/>
      </svg>
    </span>
    <div class="who">
      <h1>Staff dashboard</h1>
      <p class="muted" id="subtitle">Riverbend Diagnostics</p>
    </div>
    <div class="spacer"></div>
    <a class="ghost" href="/">&larr; Chat</a>
    <button class="ghost" id="signOut" type="button">Sign out</button>
  </header>

  <nav class="tabs" id="tabs">
    <button data-view="overview" class="active">Overview</button>
    <button data-view="conversations">Conversations</button>
    <button data-view="bookings">Bookings</button>
    <button data-view="complaints">Complaints</button>
    <button data-view="customers">Customers</button>
  </nav>

  <main id="view"></main>
</div>

<script src="/static/admin.js"></script>
</body>
</html>
